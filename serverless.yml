service: bids-api

frameworkVersion: '4'

# Built-in v4 esbuild off — scripts/build-lambda.mjs (npm run build:lambda)
# bundles index.js + all .ts source into dist/index.mjs before `sls deploy`.
build:
  esbuild: false

package:
  # Ship only the esbuild bundle (~7MB) — no node_modules, no .ts source.
  # @aws-sdk/* is left external and comes from the nodejs24.x runtime.
  patterns:
    - '!**'
    - 'dist/**'

provider:
  name: aws
  runtime: nodejs24.x
  # Graviton — bundle is pure JS (pg, bcryptjs, Prisma wasm), no native deps.
  architecture: arm64
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  logRetentionInDays: 7
  tracing:
    lambda: true
  httpApi:
    name: ${self:service}${sls:stage}
    # true = only the custom domain serves the API (raw execute-api URL off).
    # Default false so the execute-api URL works until the domain exists; set
    # DISABLE_DEFAULT_ENDPOINT=true only AFTER API_DOMAIN_NAME +
    # API_CERTIFICATE_ARN are deployed. strToBool is the boolean-safe resolver:
    # a bare ${env:...} would yield the STRING 'false', not a CFN boolean.
    disableDefaultEndpoint: ${strToBool(${env:DISABLE_DEFAULT_ENDPOINT, 'false'})}
    # CORS is answered by API Gateway, not Express: it answers preflights itself
    # (no Lambda invoke) and ignores CORS headers returned by Express. Origins are
    # listed explicitly because '*' is invalid with allowCredentials. Serverless
    # cannot split the comma-separated CORS_ORIGINS, so keep this list in sync with
    # it (Express uses CORS_ORIGINS for local dev only).
    cors:
      allowedOrigins:
        - https://bidsapp.shubsale.in
        - https://noblebids.shubsale.in
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowedHeaders:
        - content-type
        - authorization
        - accept
        - x-requested-with
      exposedResponseHeaders:
        - content-disposition
      allowCredentials: true
      maxAge: 7200
    payload: '2.0'
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}

    # Database — pooler URL only (DIRECT_URL is for migrate CLI in CI, not Lambda runtime)
    DATABASE_URL: ${env:DATABASE_URL}

    # CORS / frontend
    # Comma list, no trailing slash. Falls back to APP_URL, then localhost.
    CORS_ORIGINS: ${env:CORS_ORIGINS, env:APP_URL, 'http://localhost:3002'}

    # JWT
    JWT_SECRET: ${env:JWT_SECRET}
    REFRESH_TOKEN_SECRET: ${env:REFRESH_TOKEN_SECRET}

    ACCESS_TOKEN_EXPIRES_IN: ${env:ACCESS_TOKEN_EXPIRES_IN, ''}
    REFRESH_TOKEN_EXPIRES_IN: ${env:REFRESH_TOKEN_EXPIRES_IN, ''}

    # Auth cookies. COOKIE_DOMAIN empty = host-only cookie (no-domain mode);
    # '.example.com' for the custom-domain mode. COOKIE_SAMESITE: lax | none.
    COOKIE_DOMAIN: ${env:COOKIE_DOMAIN, ''}
    COOKIE_SAMESITE: ${env:COOKIE_SAMESITE, 'lax'}

    # App
    APP_URL: ${env:APP_URL, 'https://app.example.com'}
    # Public marketing website origin (support links in emails). Falls back to APP_URL.
    WEBSITE_URL: ${env:WEBSITE_URL, env:APP_URL, 'https://app.example.com'}
    ADMIN_EMAIL: ${env:ADMIN_EMAIL, ''}
    COMMISSION_RATE_BPS: ${env:COMMISSION_RATE_BPS, '500'}

    # Storage — S3 only
    # Resolved by CloudFormation from the distribution this stack creates - no
    # GitHub variable needed (works on the very first deploy too).
    # Public media base. CloudFront when ENABLE_CDN=true, otherwise the bucket's
    # own S3 URL (the account needs AWS Support verification before it may create
    # CloudFront distributions).
    AWS_CLOUDFRONT_URL: !If
      - HasCdn
      - !Join ['', ['https://', !GetAtt AppBucketDistribution.DomainName]]
      - !Sub 'https://${AppBucket}.s3.${AWS::Region}.amazonaws.com'
    AWS_BUCKET_NAME: ${env:AWS_BUCKET_NAME, ''}

    # Payments — Razorpay
    PAYMENT_DRIVER: ${env:PAYMENT_DRIVER, 'razorpay'}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}

    # Email (OTP for signup verification + forgot-password). driver value itself
    # decides behavior — 'stub' logs the fixed code server-side, 'ses' sends for real.
    EMAIL_DRIVER: ${env:EMAIL_DRIVER, 'stub'}
    OTP_DRIVER: ${env:OTP_DRIVER, 'stub'}
    OTP_STUB_CODE: ${env:OTP_STUB_CODE, '123456'}
    # Per-IP OTP verify/send caps; empty = the code's production defaults (20).
    # Only the dev stage sets them (see deploy_serverless.yml).
    RATE_LIMIT_AUTH_MAX: ${env:RATE_LIMIT_AUTH_MAX, ''}
    RATE_LIMIT_OTP_IP_MAX: ${env:RATE_LIMIT_OTP_IP_MAX, ''}
    # SMS (phone verification only) and two-factor auth.
    SMS_DRIVER: ${env:SMS_DRIVER, 'stub'}
    MSG91_AUTH_KEY: ${env:MSG91_AUTH_KEY, ''}
    MSG91_SENDER_ID: ${env:MSG91_SENDER_ID, ''}
    MSG91_OTP_TEMPLATE_ID: ${env:MSG91_OTP_TEMPLATE_ID, ''}
    TOTP_ENC_KEY: ${env:TOTP_ENC_KEY, ''}
    REQUIRE_ADMIN_2FA: ${env:REQUIRE_ADMIN_2FA, 'false'}
    EMAIL_FROM: ${env:EMAIL_FROM, 'noreply@example.com'}
    EMAIL_FROM_NAME: ${env:EMAIL_FROM_NAME, 'NobleBid'}
    LOGO_URL: ${env:LOGO_URL, ''}


    # Async notification queue (SQS). CloudFormation-resolved, not a manually-set
    # var — see env.ts's notify.queueUrl. Empty locally = notifications sent inline.
    NOTIFY_QUEUE_URL: !GetAtt NotifyQueue.QueueUrl

    # Management-API endpoint for the WebSocket API below (`functions.api`'s
    # websocket events) — ws.service.ts's pushToMember() posts frames here
    # (https, even though clients connect via wss). `WebsocketsApi` is the
    # exact logical id Serverless Framework 4 auto-generates for a function's
    # `websocket:` events — confirmed by running `serverless package` and
    # inspecting the synthesized template's Outputs.ServiceEndpointWebsocket
    # (same construction, wss:// swapped for https://) before wiring this by
    # hand, rather than guessing. CloudFormation-resolved, not a manually-set
    # var — see env.ts's ws.apiEndpoint.
    WS_API_ENDPOINT: !Sub 'https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'

    # Web Push (app-icon badge + notification while the app is closed) — see
    # env.ts's `push`.
    # Unset keys disable push only; the WebSocket path above is unaffected.
    VAPID_PUBLIC_KEY: ${env:VAPID_PUBLIC_KEY, ''}
    VAPID_PRIVATE_KEY: ${env:VAPID_PRIVATE_KEY, ''}
    VAPID_SUBJECT: ${env:VAPID_SUBJECT, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - 'arn:aws:s3:::${env:AWS_BUCKET_NAME}'
            - 'arn:aws:s3:::${env:AWS_BUCKET_NAME}/*'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'
        - Effect: Allow
          Action:
            - xray:PutTraceSegments
            - xray:PutTelemetryRecords
          Resource: '*'
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:SendMessageBatch
            - sqs:GetQueueUrl
          Resource: !GetAtt NotifyQueue.Arn
        # NOTE: no explicit execute-api:ManageConnections statement needed
        # here for ws.service.ts's pushToMember() — Serverless Framework 4
        # auto-adds one (broader than anything hand-written here,
        # `arn:${AWS::Partition}:execute-api:*:*:*/@connections/*`) the
        # moment any function declares `websocket:` events, confirmed by
        # inspecting the synthesized template via `serverless package`
        # before assuming it.

functions:
  api:
    name: ${self:service}${sls:stage}
    handler: dist/index.handler
    tracing: true
    events:
      # Explicit methods and no OPTIONS / '*' route on purpose: an ANY route catches
      # CORS preflights and sends them to the Lambda. Without one, API Gateway answers
      # OPTIONS itself from provider.httpApi.cors. HEAD is kept so HEAD health checks reach Express.
      - httpApi:
          path: /{proxy+}
          method: GET
      - httpApi:
          path: /{proxy+}
          method: POST
      - httpApi:
          path: /{proxy+}
          method: PUT
      - httpApi:
          path: /{proxy+}
          method: PATCH
      - httpApi:
          path: /{proxy+}
          method: DELETE
      - httpApi:
          path: /{proxy+}
          method: HEAD
      # Keep-warm ping (replaces serverless-plugin-warmup — its path.join()-built
      # package patterns and handler path break when deploying from Windows).
      # index.handler short-circuits on `warmer: true` before serverless-express.
      - schedule:
          # 5 min: idle containers were recycled before a 10 min ping, so every
          # ping was itself a cold start (1013/1039 invocations cold, Oct 2026).
          rate: rate(5 minutes)
          input:
            warmer: true
      # Real-time push — same Lambda/handler as the REST API above, fronted
      # by a second, separate API Gateway (WebSocket, not HTTP). index.handler
      # branches on event.requestContext.eventType to route these three to
      # src/modules/ws/ws.service.ts instead of serverless-express.
      - websocket:
          route: $connect
      - websocket:
          route: $disconnect
      - websocket:
          route: $default
  retentionPurge:
    name: ${self:service}${sls:stage}-retention-purge
    handler: dist/index.retentionPurgeHandler
    description: Daily retention purge (expired OTP challenges, stale sessions, WS rows, rate-limit buckets).
    timeout: 120
    events:
      - schedule: rate(1 day)
  closeAuctions:
    name: ${self:service}${sls:stage}-close-auctions
    handler: dist/index.closeAuctionsHandler
    description: Every minute - start due auctions, close ended ones (winner, commission, notifications).
    timeout: 60
    events:
      - schedule: rate(1 minute)
  endingSoon:
    name: ${self:service}${sls:stage}-ending-soon
    handler: dist/index.endingSoonHandler
    description: Every 15 min - notify watchers of auctions ending within the hour (once per watcher per auction).
    timeout: 60
    events:
      - schedule: rate(15 minutes)
  notifyWorker:
    name: ${self:service}${sls:stage}-notify-worker
    handler: dist/index.notifyWorkerHandler
    description: SQS NotifyQueue worker - in-app notification row, email, Web Push.
    timeout: 30
    # Cap parallel workers on the SQS event source, not with reservedConcurrency:
    # reserving takes slots from the account pool, and new accounts start with a
    # 10-slot quota that must keep 10 unreserved (deploy fails otherwise).
    events:
      - sqs:
          arn: !GetAtt NotifyQueue.Arn
          batchSize: 10
          maximumConcurrency: 5
          functionResponseType: ReportBatchItemFailures
  commissionReminder:
    name: ${self:service}${sls:stage}-commission-reminder
    handler: dist/index.commissionReminderHandler
    description: Daily - remind sellers of overdue / 3-day-old DUE commissions (one reminder per commission per day).
    timeout: 60
    events:
      - schedule: rate(1 day)
  salesMaintenance:
    name: ${self:service}${sls:stage}-sales-maintenance
    handler: dist/index.salesMaintenanceHandler
    description: Hourly - cancel unpaid sales (and strike the buyer), auto-confirm shipped sales after 7 days and release held funds, retry failed releases, refund / forfeit bid deposits, expire second-chance offers.
    timeout: 120
    events:
      - schedule: rate(1 hour)
  riskScan:
    name: ${self:service}${sls:stage}-risk-scan
    handler: dist/index.riskScanHandler
    description: Daily - scan the last 90 days of bids for shill-bid patterns and flag them for admin review.
    timeout: 120
    events:
      - schedule: rate(1 day)

resources:
  Conditions:
    HasAlertEmail: !Not [!Equals ["${env:ALERT_EMAIL, ''}", ""]]
    # CloudFront image CDN only when ENABLE_CDN=true (GitHub variable).
    HasCdn: !Equals ["${env:ENABLE_CDN, 'false'}", "true"]
    # Custom API domain only when BOTH are set (ACM cert must be in the stack region).
    HasCustomDomain: !And
      - !Not [!Equals ["${env:API_DOMAIN_NAME, ''}", ""]]
      - !Not [!Equals ["${env:API_CERTIFICATE_ARN, ''}", ""]]

  # Whole-API throttle at API Gateway (HttpApiStage is the stage Serverless
  # generates for provider.httpApi). Requests past it get a 429 from API
  # Gateway before any Lambda runs — caps cost and load from a flood. Not per
  # client; per-IP limits live in src/core/middleware/rateLimit.ts.
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100

  Resources:
    # Abuse alarms, created only when ALERT_EMAIL is set (GitHub var
    # ALERT_EMAIL / ALERT_EMAIL_PROD). Scoped to this stack's API + function —
    # an AWS Budget would be account-wide, and the dev account is shared.
    # AWS emails a confirmation link once; alarms stay silent until accepted.
    AlertTopic:
      Type: AWS::SNS::Topic
      Condition: HasAlertEmail
      Properties:
        TopicName: ${self:service}-${sls:stage}-alerts
        Subscription:
          - Protocol: email
            Endpoint: ${env:ALERT_EMAIL, ''}
    ApiRequestSpikeAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: HasAlertEmail
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-request-spike
        AlarmDescription: HTTP API request volume far above normal — possible abuse or a client retry loop.
        Namespace: AWS/ApiGateway
        MetricName: Count
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 3000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlertTopic]
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Condition: HasAlertEmail
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-5xx
        AlarmDescription: The API is returning server errors (5xx) — Lambda failures, timeouts, or DB trouble.
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value: !Ref HttpApi
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 25
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlertTopic]
    # Async notification queue — see provider.environment.NOTIFY_QUEUE_URL.
    NotifyQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}${sls:stage}-notify
        VisibilityTimeout: 60
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotifyDLQ.Arn
          maxReceiveCount: 3

    NotifyDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}${sls:stage}-notify-dlq
        MessageRetentionPeriod: 1209600

    # App S3 bucket (holds uploads — auction images + avatars).
    # Created by the stack if it does not exist; name comes from AWS_BUCKET_NAME
    # (globally unique). Private + encrypted. Retain on stack delete so files aren't lost.
    AppBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${env:AWS_BUCKET_NAME}
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # CORS so the browser can PUT directly to S3 via presigned URLs from the
        # frontend (localhost in dev, the hosted domain in prod). The presigned URL
        # is itself the auth (short-lived, signed) — origin is not the gatekeeper,
        # so '*' is acceptable here. GET/HEAD allow direct reads if not via CloudFront.
        CorsConfiguration:
          CorsRules:
            # '*' — presigned URL is the auth (short-lived, signed), origin is not the
            # gatekeeper, so any origin may upload/read. See comment above.
            - AllowedOrigins: ['*']
              AllowedMethods: [GET, PUT, HEAD]
              AllowedHeaders: ['*']
              ExposedHeaders: [ETag]
              MaxAge: 3000
        # ACLs stay blocked in every mode. Without the CDN, a bucket policy (below)
        # makes ONLY auctions/* and avatars/* publicly readable.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: !If [HasCdn, true, false]
          IgnorePublicAcls: true
          RestrictPublicBuckets: !If [HasCdn, true, false]

    # OAC lets CloudFront read the private AppBucket directly (no public bucket ACL needed).
    AppBucketOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Condition: HasCdn
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-${sls:stage}-oac
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # CDN in front of AppBucket. Its domain feeds AWS_CLOUDFRONT_URL directly
    # (provider.environment) and the CloudFrontDomainName output.
    AppBucketDistribution:
      Type: AWS::CloudFront::Distribution
      Condition: HasCdn
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: CDN for ${self:service} ${sls:stage} uploads bucket
          Origins:
            - Id: AppBucketOrigin
              DomainName: !GetAtt AppBucket.RegionalDomainName
              S3OriginConfig: {}
              OriginAccessControlId: !GetAtt AppBucketOAC.Id
          DefaultCacheBehavior:
            TargetOriginId: AppBucketOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed-CachingOptimized
          # PriceClass_200 adds edge locations in India (most users); _100 is NA + Europe only.
          PriceClass: PriceClass_200

    # The bucket's ONE policy, for both modes:
    #   CDN    - only this distribution (OAC + SourceArn) may read; bucket fully private.
    #   no CDN - public read on auctions/* and avatars/* only; every other key private.
    # Keep it a single resource, and keep this logical ID (it was created in no-CDN
    # mode). Two BucketPolicy resources, or a rename, make CloudFormation create the
    # new policy and then delete the old resource, and that delete removes the
    # bucket's whole policy (CloudFront would then get 403 on every image).
    AppBucketPublicMediaPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref AppBucket
        PolicyDocument:
          Statement:
            - !If
              - HasCdn
              - Sid: CloudFrontReadViaOAC
                Effect: Allow
                Principal:
                  Service: cloudfront.amazonaws.com
                Action: s3:GetObject
                Resource: !Sub '${AppBucket.Arn}/*'
                Condition:
                  StringEquals:
                    AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AppBucketDistribution.Id}'
              - Sid: PublicReadMedia
                Effect: Allow
                Principal: '*'
                Action: s3:GetObject
                Resource:
                  - !Sub '${AppBucket.Arn}/auctions/*'
                  - !Sub '${AppBucket.Arn}/avatars/*'

    # Optional custom domain (api.<domain>). Created only when API_DOMAIN_NAME and
    # API_CERTIFICATE_ARN are set. After deploy, create a DNS CNAME
    # API_DOMAIN_NAME -> output CustomDomainTarget.
    ApiDomainName:
      Type: AWS::ApiGatewayV2::DomainName
      Condition: HasCustomDomain
      Properties:
        DomainName: ${env:API_DOMAIN_NAME, ''}
        DomainNameConfigurations:
          - EndpointType: REGIONAL
            SecurityPolicy: TLS_1_2
            CertificateArn: ${env:API_CERTIFICATE_ARN, ''}
    ApiDomainMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Condition: HasCustomDomain
      DependsOn: [ApiDomainName, HttpApiStage]
      Properties:
        DomainName: !Ref ApiDomainName
        ApiId: !Ref HttpApi
        Stage: !Ref HttpApiStage

  Outputs:
    # HttpApiUrl is generated by Serverless itself; redefining it here merged
    # two intrinsic functions into one Value and CloudFormation rejected it
    # ("Value ... must evaluate to a String and not a Map").
    WebSocketUrl:
      Description: WebSocket API URL (wss)
      Value: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}'
    CloudFrontDomainName:
      Description: CloudFront domain for the uploads bucket
      Condition: HasCdn
      Value: !GetAtt AppBucketDistribution.DomainName
    MediaBaseUrl:
      Description: Public base URL for uploaded images (CloudFront or S3)
      Value: !If
        - HasCdn
        - !Join ['', ['https://', !GetAtt AppBucketDistribution.DomainName]]
        - !Sub 'https://${AppBucket}.s3.${AWS::Region}.amazonaws.com'
    NotifyQueueUrl:
      Description: SQS NotifyQueue URL
      Value: !GetAtt NotifyQueue.QueueUrl
    CustomDomainTarget:
      Description: Create a DNS CNAME API_DOMAIN_NAME -> this value
      Condition: HasCustomDomain
      Value: !GetAtt ApiDomainName.RegionalDomainName
