name: Deploy to AWS Lambda (Serverless Framework)

# push to `dev`  -> stage dev  (plain secret/variable names)
# push to `main` -> stage prod (names suffixed _PROD)
# workflow_dispatch: run it from the dev or main branch in the Actions tab.
# Full secret/variable list: readme/flows/deployment.md and deploy/*.env.example.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# One deploy per branch at a time. Never cancel a running deploy mid-CloudFormation.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        # Dev deps included: esbuild (devDependency) builds the Lambda bundle below.
        # Only dist/** is packaged, so dev deps never reach the Lambda zip.
        # --ignore-scripts skips the husky "prepare" script; `npx prisma generate`
        # runs explicitly below.
        run: npm ci --ignore-scripts

      - name: Install Serverless Framework v4
        run: npm install -g serverless@4

      - name: Set environment variables (dev)
        if: github.ref != 'refs/heads/main'
        # Values arrive through the step env (never pasted into the script text),
        # so characters like $ in a password are not touched by bash. Each stage
        # reads ONLY its own names (plain); empty values are skipped so
        # serverless.yml ${env:X, default} fallbacks apply.
        env:
          STAGE: dev
          NODE_ENV: production
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE }}
          APP_URL: ${{ vars.APP_URL }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          COMMISSION_RATE_BPS: ${{ vars.COMMISSION_RATE_BPS }}
          PAYMENT_DRIVER: ${{ vars.PAYMENT_DRIVER }}
          EMAIL_DRIVER: ${{ vars.EMAIL_DRIVER || 'stub' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME }}
          LOGO_URL: ${{ vars.LOGO_URL }}
          OTP_STUB_CODE: ${{ vars.OTP_STUB_CODE }}
          API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME }}
          API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
          DISABLE_DEFAULT_ENDPOINT: ${{ vars.DISABLE_DEFAULT_ENDPOINT }}
          RATE_LIMIT_AUTH_MAX: ${{ vars.RATE_LIMIT_AUTH_MAX || '300' }}
          RATE_LIMIT_OTP_IP_MAX: ${{ vars.RATE_LIMIT_OTP_IP_MAX || '300' }}
        run: |
          for k in STAGE NODE_ENV VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SERVERLESS_ACCESS_KEY DATABASE_URL DIRECT_URL JWT_SECRET REFRESH_TOKEN_SECRET RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET AWS_REGION AWS_BUCKET_NAME CORS_ORIGINS COOKIE_DOMAIN COOKIE_SAMESITE APP_URL ADMIN_EMAIL ALERT_EMAIL COMMISSION_RATE_BPS PAYMENT_DRIVER EMAIL_DRIVER EMAIL_FROM EMAIL_FROM_NAME LOGO_URL OTP_STUB_CODE API_DOMAIN_NAME API_CERTIFICATE_ARN DISABLE_DEFAULT_ENDPOINT RATE_LIMIT_AUTH_MAX RATE_LIMIT_OTP_IP_MAX; do
            v="${!k}"
            if [[ -n "$v" ]]; then printf '%s=%s\n' "$k" "$v" >> "$GITHUB_ENV"; fi
          done

      - name: Set environment variables (prod)
        if: github.ref == 'refs/heads/main'
        # Values arrive through the step env (never pasted into the script text),
        # so characters like $ in a password are not touched by bash. Each stage
        # reads ONLY its own names (*_PROD); empty values are skipped so
        # serverless.yml ${env:X, default} fallbacks apply.
        env:
          STAGE: prod
          NODE_ENV: production
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY_PROD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          DIRECT_URL: ${{ secrets.DIRECT_URL_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET_PROD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID_PROD }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET_PROD }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET_PROD }}
          AWS_REGION: ${{ vars.AWS_REGION_PROD }}
          AWS_BUCKET_NAME: ${{ vars.AWS_BUCKET_NAME_PROD }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS_PROD }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN_PROD }}
          COOKIE_SAMESITE: ${{ vars.COOKIE_SAMESITE_PROD }}
          APP_URL: ${{ vars.APP_URL_PROD }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL_PROD }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL_PROD }}
          COMMISSION_RATE_BPS: ${{ vars.COMMISSION_RATE_BPS_PROD }}
          PAYMENT_DRIVER: ${{ vars.PAYMENT_DRIVER_PROD }}
          EMAIL_DRIVER: ${{ vars.EMAIL_DRIVER_PROD || 'ses' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM_PROD }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME_PROD }}
          LOGO_URL: ${{ vars.LOGO_URL_PROD }}
          OTP_STUB_CODE: ${{ vars.OTP_STUB_CODE_PROD }}
          API_DOMAIN_NAME: ${{ vars.API_DOMAIN_NAME_PROD }}
          API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN_PROD }}
          DISABLE_DEFAULT_ENDPOINT: ${{ vars.DISABLE_DEFAULT_ENDPOINT_PROD }}
        run: |
          for k in STAGE NODE_ENV VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SERVERLESS_ACCESS_KEY DATABASE_URL DIRECT_URL JWT_SECRET REFRESH_TOKEN_SECRET RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET AWS_REGION AWS_BUCKET_NAME CORS_ORIGINS COOKIE_DOMAIN COOKIE_SAMESITE APP_URL ADMIN_EMAIL ALERT_EMAIL COMMISSION_RATE_BPS PAYMENT_DRIVER EMAIL_DRIVER EMAIL_FROM EMAIL_FROM_NAME LOGO_URL OTP_STUB_CODE API_DOMAIN_NAME API_CERTIFICATE_ARN DISABLE_DEFAULT_ENDPOINT; do
            v="${!k}"
            if [[ -n "$v" ]]; then printf '%s=%s\n' "$k" "$v" >> "$GITHUB_ENV"; fi
          done


      - name: Check required settings
        # Fail early with the NAME of what is missing (never the value).
        run: |
          sfx=""; [[ "$STAGE" == "prod" ]] && sfx="_PROD"
          missing=0
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SERVERLESS_ACCESS_KEY DATABASE_URL DIRECT_URL \
                   JWT_SECRET REFRESH_TOKEN_SECRET AWS_REGION AWS_BUCKET_NAME; do
            if [[ -z "${!k}" ]]; then echo "::error::Missing required setting for stage ${STAGE}: ${k}${sfx}"; missing=1; fi
          done
          if [[ "${PAYMENT_DRIVER}" == "razorpay" ]]; then
            for k in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
              if [[ -z "${!k}" ]]; then echo "::error::PAYMENT_DRIVER=razorpay needs ${k}${sfx}"; missing=1; fi
            done
          fi
          if [[ "${EMAIL_DRIVER}" == "ses" && ( -z "${EMAIL_FROM}" || "${EMAIL_FROM}" == "noreply@example.com" ) ]]; then
            echo "::error::EMAIL_DRIVER=ses needs a real EMAIL_FROM${sfx}"; missing=1
          fi
          if [[ "${DISABLE_DEFAULT_ENDPOINT}" == "true" && ( -z "${API_DOMAIN_NAME}" || -z "${API_CERTIFICATE_ARN}" ) ]]; then
            echo "::error::DISABLE_DEFAULT_ENDPOINT=true needs API_DOMAIN_NAME and API_CERTIFICATE_ARN"; missing=1
          fi
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        # prisma.config.ts reads DIRECT_URL (non-pooled) for migrations.
        run: npx prisma migrate deploy

      - name: Build Lambda bundle
        # Must run after prisma generate - bundles src/generated/prisma into dist/index.mjs.
        run: npm run build:lambda

      - name: Clear stale Serverless cache
        run: rm -rf ~/.serverless/releases

      - name: Deploy with Serverless
        # --force: sls compares a hash of the packaged template/code against the last
        # attempted hash, not live CFN state. After a rolled-back deploy an unchanged
        # repo keeps saying "No changes to deploy"; --force always calls UpdateStack.
        # AWS_CLOUDFRONT_URL is resolved by CloudFormation (serverless.yml), not here.
        run: serverless deploy --stage "$STAGE" --force

      - name: Print stack outputs
        run: |
          STACK="bids-api-${STAGE}"
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text 2>/dev/null || true
          }
          API=$(out HttpApiUrl)
          WS=$(out WebSocketUrl)
          CF=$(out CloudFrontDomainName)
          Q=$(out NotifyQueueUrl)
          DOM=$(out CustomDomainTarget)
          {
            echo "## Deployed ${STACK} (stage ${STAGE})"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| HTTP API | ${API} |"
            echo "| WebSocket | ${WS} |"
            echo "| CloudFront | https://${CF} |"
            echo "| NotifyQueue | ${Q} |"
            if [[ -n "$DOM" && "$DOM" != "None" ]]; then
              echo "| Custom domain | https://${API_DOMAIN_NAME} |"
              echo "| DNS CNAME | ${API_DOMAIN_NAME} -> ${DOM} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP API: ${API}"
          echo "WebSocket: ${WS}"
          echo "CloudFront: https://${CF}"
