name: Deploy to AWS Lambda (Serverless Framework)

# push to `dev`  -> stage dev  (plain secret/variable names)
# push to `main` -> stage prod (names suffixed _PROD)
# workflow_dispatch: run it from the dev or main branch in the Actions tab.
# Full secret/variable list: readme/flows/deployment.md and deploy/*.env.example.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# One deploy per branch at a time. Never cancel a running deploy mid-CloudFormation.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        # Dev deps included: esbuild (devDependency) builds the Lambda bundle below.
        # Only dist/** is packaged, so dev deps never reach the Lambda zip.
        # --ignore-scripts skips the husky "prepare" script; `npx prisma generate`
        # runs explicitly below.
        run: npm ci --ignore-scripts

      - name: Install Serverless Framework v4
        run: npm install -g serverless@4

      - name: Set environment variables
        # Every per-stage value has a plain (dev) and a _PROD (main) GitHub
        # secret/variable; each stage reads ONLY its own (no cross-stage fallback).
        # Secrets come from `secrets.*`, never `vars.*`. Optional ones may be empty.
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "STAGE=prod" >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
            echo "SERVERLESS_ACCESS_KEY=${{ secrets.SERVERLESS_ACCESS_KEY_PROD }}" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.DIRECT_URL_PROD }}" >> $GITHUB_ENV
            echo "JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}" >> $GITHUB_ENV
            echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET_PROD }}" >> $GITHUB_ENV
            echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID_PROD }}" >> $GITHUB_ENV
            echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET_PROD }}" >> $GITHUB_ENV
            echo "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET_PROD }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ vars.AWS_REGION_PROD }}" >> $GITHUB_ENV
            echo "AWS_BUCKET_NAME=${{ vars.AWS_BUCKET_NAME_PROD }}" >> $GITHUB_ENV
            echo "CORS_ORIGINS=${{ vars.CORS_ORIGINS_PROD }}" >> $GITHUB_ENV
            echo "COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN_PROD }}" >> $GITHUB_ENV
            echo "COOKIE_SAMESITE=${{ vars.COOKIE_SAMESITE_PROD }}" >> $GITHUB_ENV
            echo "APP_URL=${{ vars.APP_URL_PROD }}" >> $GITHUB_ENV
            echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL_PROD }}" >> $GITHUB_ENV
            echo "ALERT_EMAIL=${{ vars.ALERT_EMAIL_PROD }}" >> $GITHUB_ENV
            echo "COMMISSION_RATE_BPS=${{ vars.COMMISSION_RATE_BPS_PROD }}" >> $GITHUB_ENV
            echo "PAYMENT_DRIVER=${{ vars.PAYMENT_DRIVER_PROD }}" >> $GITHUB_ENV
            echo "EMAIL_DRIVER=${{ vars.EMAIL_DRIVER_PROD || 'ses' }}" >> $GITHUB_ENV
            echo "EMAIL_FROM=${{ vars.EMAIL_FROM_PROD }}" >> $GITHUB_ENV
            echo "EMAIL_FROM_NAME=${{ vars.EMAIL_FROM_NAME_PROD }}" >> $GITHUB_ENV
            echo "LOGO_URL=${{ vars.LOGO_URL_PROD }}" >> $GITHUB_ENV
            echo "OTP_STUB_CODE=${{ vars.OTP_STUB_CODE_PROD }}" >> $GITHUB_ENV
            echo "API_DOMAIN_NAME=${{ vars.API_DOMAIN_NAME_PROD }}" >> $GITHUB_ENV
            echo "API_CERTIFICATE_ARN=${{ vars.API_CERTIFICATE_ARN_PROD }}" >> $GITHUB_ENV
            echo "DISABLE_DEFAULT_ENDPOINT=${{ vars.DISABLE_DEFAULT_ENDPOINT_PROD }}" >> $GITHUB_ENV
          else
            echo "STAGE=dev" >> $GITHUB_ENV
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
            echo "SERVERLESS_ACCESS_KEY=${{ secrets.SERVERLESS_ACCESS_KEY }}" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> $GITHUB_ENV
            echo "DIRECT_URL=${{ secrets.DIRECT_URL }}" >> $GITHUB_ENV
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> $GITHUB_ENV
            echo "REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}" >> $GITHUB_ENV
            echo "RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}" >> $GITHUB_ENV
            echo "RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}" >> $GITHUB_ENV
            echo "RAZORPAY_WEBHOOK_SECRET=${{ secrets.RAZORPAY_WEBHOOK_SECRET }}" >> $GITHUB_ENV
            echo "AWS_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV
            echo "AWS_BUCKET_NAME=${{ vars.AWS_BUCKET_NAME }}" >> $GITHUB_ENV
            echo "CORS_ORIGINS=${{ vars.CORS_ORIGINS }}" >> $GITHUB_ENV
            echo "COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}" >> $GITHUB_ENV
            echo "COOKIE_SAMESITE=${{ vars.COOKIE_SAMESITE }}" >> $GITHUB_ENV
            echo "APP_URL=${{ vars.APP_URL }}" >> $GITHUB_ENV
            echo "ADMIN_EMAIL=${{ vars.ADMIN_EMAIL }}" >> $GITHUB_ENV
            echo "ALERT_EMAIL=${{ vars.ALERT_EMAIL }}" >> $GITHUB_ENV
            echo "COMMISSION_RATE_BPS=${{ vars.COMMISSION_RATE_BPS }}" >> $GITHUB_ENV
            echo "PAYMENT_DRIVER=${{ vars.PAYMENT_DRIVER }}" >> $GITHUB_ENV
            echo "EMAIL_DRIVER=${{ vars.EMAIL_DRIVER || 'stub' }}" >> $GITHUB_ENV
            echo "EMAIL_FROM=${{ vars.EMAIL_FROM }}" >> $GITHUB_ENV
            echo "EMAIL_FROM_NAME=${{ vars.EMAIL_FROM_NAME }}" >> $GITHUB_ENV
            echo "LOGO_URL=${{ vars.LOGO_URL }}" >> $GITHUB_ENV
            echo "OTP_STUB_CODE=${{ vars.OTP_STUB_CODE }}" >> $GITHUB_ENV
            echo "API_DOMAIN_NAME=${{ vars.API_DOMAIN_NAME }}" >> $GITHUB_ENV
            echo "API_CERTIFICATE_ARN=${{ vars.API_CERTIFICATE_ARN }}" >> $GITHUB_ENV
            echo "DISABLE_DEFAULT_ENDPOINT=${{ vars.DISABLE_DEFAULT_ENDPOINT }}" >> $GITHUB_ENV
            # Dev only: raised per-IP OTP caps for repeated automated signups from
            # one CI IP. Prod keeps the code's defaults (20).
            echo "RATE_LIMIT_AUTH_MAX=${{ vars.RATE_LIMIT_AUTH_MAX || '300' }}" >> $GITHUB_ENV
            echo "RATE_LIMIT_OTP_IP_MAX=${{ vars.RATE_LIMIT_OTP_IP_MAX || '300' }}" >> $GITHUB_ENV
          fi
          # Shared by both stages (no _PROD variant). VAPID: one pair, never rotate.
          echo "NODE_ENV=production" >> $GITHUB_ENV
          echo "VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}" >> $GITHUB_ENV
          echo "VAPID_PRIVATE_KEY=${{ secrets.VAPID_PRIVATE_KEY }}" >> $GITHUB_ENV
          echo "VAPID_SUBJECT=${{ vars.VAPID_SUBJECT }}" >> $GITHUB_ENV
          # Drop empty values so serverless.yml ${env:X, default} fallbacks apply
          # (an exported empty string would count as a set value).
          sed -i "/^[A-Za-z_]*=$/d" "$GITHUB_ENV"

      - name: Check required settings
        # Fail early with the NAME of what is missing (never the value).
        run: |
          sfx=""; [[ "$STAGE" == "prod" ]] && sfx="_PROD"
          missing=0
          for k in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY SERVERLESS_ACCESS_KEY DATABASE_URL DIRECT_URL \
                   JWT_SECRET REFRESH_TOKEN_SECRET AWS_REGION AWS_BUCKET_NAME; do
            if [[ -z "${!k}" ]]; then echo "::error::Missing required setting for stage ${STAGE}: ${k}${sfx}"; missing=1; fi
          done
          if [[ "${PAYMENT_DRIVER}" == "razorpay" ]]; then
            for k in RAZORPAY_KEY_ID RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET; do
              if [[ -z "${!k}" ]]; then echo "::error::PAYMENT_DRIVER=razorpay needs ${k}${sfx}"; missing=1; fi
            done
          fi
          if [[ "${EMAIL_DRIVER}" == "ses" && ( -z "${EMAIL_FROM}" || "${EMAIL_FROM}" == "noreply@example.com" ) ]]; then
            echo "::error::EMAIL_DRIVER=ses needs a real EMAIL_FROM${sfx}"; missing=1
          fi
          if [[ "${DISABLE_DEFAULT_ENDPOINT}" == "true" && ( -z "${API_DOMAIN_NAME}" || -z "${API_CERTIFICATE_ARN}" ) ]]; then
            echo "::error::DISABLE_DEFAULT_ENDPOINT=true needs API_DOMAIN_NAME and API_CERTIFICATE_ARN"; missing=1
          fi
          exit $missing

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        # prisma.config.ts reads DIRECT_URL (non-pooled) for migrations.
        run: npx prisma migrate deploy

      - name: Build Lambda bundle
        # Must run after prisma generate - bundles src/generated/prisma into dist/index.mjs.
        run: npm run build:lambda

      - name: Clear stale Serverless cache
        run: rm -rf ~/.serverless/releases

      - name: Deploy with Serverless
        # --force: sls compares a hash of the packaged template/code against the last
        # attempted hash, not live CFN state. After a rolled-back deploy an unchanged
        # repo keeps saying "No changes to deploy"; --force always calls UpdateStack.
        # AWS_CLOUDFRONT_URL is resolved by CloudFormation (serverless.yml), not here.
        run: serverless deploy --stage "$STAGE" --force

      - name: Print stack outputs
        run: |
          STACK="bids-api-${STAGE}"
          out() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text 2>/dev/null || true
          }
          API=$(out HttpApiUrl)
          WS=$(out WebSocketUrl)
          CF=$(out CloudFrontDomainName)
          Q=$(out NotifyQueueUrl)
          DOM=$(out CustomDomainTarget)
          {
            echo "## Deployed ${STACK} (stage ${STAGE})"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| HTTP API | ${API} |"
            echo "| WebSocket | ${WS} |"
            echo "| CloudFront | https://${CF} |"
            echo "| NotifyQueue | ${Q} |"
            if [[ -n "$DOM" && "$DOM" != "None" ]]; then
              echo "| Custom domain | https://${API_DOMAIN_NAME} |"
              echo "| DNS CNAME | ${API_DOMAIN_NAME} -> ${DOM} |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP API: ${API}"
          echo "WebSocket: ${WS}"
          echo "CloudFront: https://${CF}"
